<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain 1 - Python MSA</title>
    <style>
        body { font-family: sans-serif; background-color: #f0fdf4; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        button { padding: 10px 15px; margin-right: 10px; cursor: pointer; background-color: #16a34a; color: white; border: none; border-radius: 4px;}
        button:hover { background-color: #15803d; }
        .item-btn { padding: 4px 8px; margin-left: 5px; cursor: pointer; border: none; border-radius: 3px; font-size: 12px; }
        .btn-edit { background-color: #ca8a04; color: white; }
        .btn-edit:hover { background-color: #a16207; }
        .btn-delete { background-color: #dc2626; color: white; }
        .btn-delete:hover { background-color: #b91c1c; }
        li { margin-bottom: 10px; list-style-type: none; display: flex; align-items: center; justify-content: space-between; padding: 8px; background: #f9fafb; border-radius: 4px; border: 1px solid #e5e7eb; }
        ul { padding-left: 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #16a34a;">🟢 Domain 1 (Apache + Python FastAPI + MariaDB)</h1>
        <p>도커 엔진,컨테이너를 이용한 CRUD 시연</p>
        
        <button onclick="createData()">데이터 생성 (Create)</button>
        <button onclick="loadData()">데이터 조회 (Read)</button>

        <ul id="data-list" style="margin-top: 20px; font-weight: bold;"></ul>
    </div>

    <script>
        // 백엔드 API로 데이터 생성 요청 (POST)
        async function createData() {
            const content = prompt('추가할 내용을 입력하세요:', 'Domain 1');
            if (content === null) return; // 취소 버튼 누름
            
            const res = await fetch('/api/texts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });
            const result = await res.json();
            alert(result.message);
            loadData(); // 생성 후 즉시 리스트 갱신
        }

        // 백엔드 API에서 데이터 불러오기 (GET)
        async function loadData() {
            const res = await fetch('/api/texts');
            const result = await res.json();
            const list = document.getElementById('data-list');
            list.innerHTML = ''; // 기존 목록 초기화
            
            result.data.forEach(item => {
                const li = document.createElement('li');
                
                const textSpan = document.createElement('span');
                textSpan.textContent = item.content;
                li.appendChild(textSpan);
                
                const btnContainer = document.createElement('div');
                
                const editBtn = document.createElement('button');
                editBtn.className = 'item-btn btn-edit';
                editBtn.textContent = '수정';
                editBtn.onclick = () => updateData(item.id, item.content);
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'item-btn btn-delete';
                deleteBtn.textContent = '삭제';
                deleteBtn.onclick = () => deleteData(item.id);
                
                btnContainer.appendChild(editBtn);
                btnContainer.appendChild(deleteBtn);
                li.appendChild(btnContainer);
                
                list.appendChild(li);
            });
        }

        // 백엔드 API로 데이터 수정 요청 (PUT)
        async function updateData(id, currentContent) {
            const newContent = prompt('수정할 내용을 입력하세요:', currentContent);
            if (newContent === null || newContent.trim() === '') return;
            
            const res = await fetch(`/api/texts/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: newContent })
            });
            const result = await res.json();
            alert(result.message);
            loadData();
        }

        // 백엔드 API로 데이터 삭제 요청 (DELETE)
        async function deleteData(id) {
            if (!confirm('정말로 삭제하시겠습니까?')) return;
            
            const res = await fetch(`/api/texts/${id}`, {
                method: 'DELETE'
            });
            const result = await res.json();
            alert(result.message);
            loadData();
        }
    </script>
</body>
</html>
